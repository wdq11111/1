<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>轨道 Orbit</title>
<style>
  :root {
    --bg: #0e1116;
    --ring: #2a3240;
    --player: #7dd3fc;
    --hazard: #f87171;
    --gem: #fcd34d;
    --text: #e5e7eb;
    --muted: #8b95a5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; touch-action: manipulation; user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 16px; left: 0; right: 0; text-align: center;
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #score { font-size: 40px; font-weight: 700; }
  #best { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 16px; pointer-events: none;
  }
  #overlay h1 { margin: 0; font-size: 44px; letter-spacing: 4px; }
  #overlay p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="best">最高 0</div></div>
<div id="overlay">
  <h1 id="title">轨道</h1>
  <p id="msg">点击屏幕 / 按空格 切换内外轨道<br>躲开红色障碍，吃掉金色光点</p>
  <p id="hint">点击开始</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const hintEl = document.getElementById('hint');

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ring: css('--ring'), player: css('--player'), hazard: css('--hazard'), gem: css('--gem') };

  let W, H, cx, cy, R1, R2, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2 + 20;
    const base = Math.min(W, H - 80) / 2;
    R2 = base * 0.82;   // 外轨
    R1 = base * 0.52;   // 内轨
  }
  window.addEventListener('resize', resize);
  resize();

  let best = 0;
  try { best = +localStorage.getItem('orbit-best') || 0; } catch (e) {}
  bestEl.textContent = '最高 ' + best;

  // state: 'menu' | 'play' | 'over'
  let state = 'menu';
  let angle, lane, laneT, speed, score, objects, spawnTimer, time, particles, shake;

  function reset() {
    angle = -Math.PI / 2;
    lane = 1;          // 0 内, 1 外
    laneT = 1;         // 插值后的轨道位置
    speed = 1.6;       // 弧度/秒
    score = 0;
    objects = [];
    particles = [];
    spawnTimer = 0.8;
    time = 0;
    shake = 0;
    scoreEl.textContent = '0';
  }

  const radiusAt = t => R1 + (R2 - R1) * t;

  function spawn() {
    // 在玩家前方约半圈处生成，留出反应时间
    const ahead = Math.PI * (0.75 + Math.random() * 0.5);
    const a = angle + ahead;
    const r = Math.random();
    if (r < 0.62) {
      objects.push({ type: 'hazard', a, lane: Math.random() < 0.5 ? 0 : 1, life: 0 });
    } else if (r < 0.75 && time > 12) {
      // 双轨错位障碍
      const l = Math.random() < 0.5 ? 0 : 1;
      objects.push({ type: 'hazard', a, lane: l, life: 0 });
      objects.push({ type: 'hazard', a: a + 0.55, lane: 1 - l, life: 0 });
    } else {
      objects.push({ type: 'gem', a, lane: Math.random() < 0.5 ? 0 : 1, life: 0 });
    }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
    }
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
  }

  function gameOver() {
    state = 'over';
    shake = 12;
    const px = cx + Math.cos(angle) * radiusAt(laneT);
    const py = cy + Math.sin(angle) * radiusAt(laneT);
    burst(px, py, C.player, 40);
    if (score > best) {
      best = score;
      try { localStorage.setItem('orbit-best', best); } catch (e) {}
      bestEl.textContent = '最高 ' + best;
      titleEl.textContent = '新纪录！';
    } else {
      titleEl.textContent = '撞了';
    }
    msgEl.innerHTML = '得分 ' + score;
    hintEl.textContent = '点击重来';
    setTimeout(() => overlay.classList.remove('hidden'), 350);
  }

  function input() {
    if (state === 'play') {
      lane = 1 - lane;
    } else if (state === 'menu' || (state === 'over' && !overlay.classList.contains('hidden'))) {
      reset();
      state = 'play';
      overlay.classList.add('hidden');
    }
  }
  window.addEventListener('pointerdown', e => { e.preventDefault(); input(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
      e.preventDefault();
      if (!e.repeat) input();
    }
  });

  function update(dt) {
    // 粒子在任何状态下都更新
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt * 40);

    if (state !== 'play') return;

    time += dt;
    speed = 1.6 + Math.min(time * 0.035, 2.2);
    angle += speed * dt;
    laneT += (lane - laneT) * Math.min(1, dt * 14);

    // 存活加分
    const prev = Math.floor((time - dt) * 2);
    if (Math.floor(time * 2) > prev) addScore(1);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.45, 1.1 - time * 0.012) * (0.8 + Math.random() * 0.4);
    }

    const pr = radiusAt(laneT);
    const px = cx + Math.cos(angle) * pr;
    const py = cy + Math.sin(angle) * pr;

    for (const o of objects) {
      o.life += dt;
      const or = radiusAt(o.lane);
      const ox = cx + Math.cos(o.a) * or;
      const oy = cy + Math.sin(o.a) * or;
      const dist = Math.hypot(px - ox, py - oy);
      if (o.type === 'hazard' && dist < 17) { gameOver(); return; }
      if (o.type === 'gem' && dist < 20 && !o.dead) {
        o.dead = true;
        addScore(5);
        burst(ox, oy, C.gem, 14);
      }
      // 玩家经过后很远就移除
      // angle 与 o.a 都是未回绕的单调值，直接相减即可
      if (angle - o.a > 1.2) o.dead = true;
    }
    objects = objects.filter(o => !o.dead);
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 轨道
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.ring;
    for (const r of [R1, R2]) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }

    // 物体
    for (const o of objects) {
      const or = radiusAt(o.lane);
      const ox = cx + Math.cos(o.a) * or;
      const oy = cy + Math.sin(o.a) * or;
      const k = Math.min(1, o.life * 4);
      if (o.type === 'hazard') {
        ctx.fillStyle = C.hazard;
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(o.a + o.life * 3);
        const s = 11 * k;
        ctx.fillRect(-s, -s, s * 2, s * 2);
        ctx.restore();
      } else {
        ctx.fillStyle = C.gem;
        ctx.beginPath();
        ctx.arc(ox, oy, (7 + Math.sin(o.life * 6) * 1.5) * k, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 玩家（含拖尾）
    if (state !== 'over') {
      const showAngle = state === 'menu' ? performance.now() / 1000 : angle;
      const pr = radiusAt(state === 'menu' ? 1 : laneT);
      for (let i = 8; i >= 0; i--) {
        const a = showAngle - i * 0.04;
        ctx.globalAlpha = i === 0 ? 1 : 0.08 * (8 - i) / 8 + 0.02;
        ctx.fillStyle = C.player;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * pr, cy + Math.sin(a) * pr, i === 0 ? 10 : 9 - i * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
