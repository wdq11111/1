<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多引擎翻译</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb; --accent-text: #fff; --err: #b91c1c; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #8b95a5;
            --line: #2a313b; --accent: #4f8cff; --accent-text: #0b0d10; --err: #f87171; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
                   border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 6px 18px; }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; min-height: 140px; resize: vertical; font: inherit; color: inherit;
             background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin: 4px 2px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chip.off { color: var(--muted); border-style: dashed; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 90px;
          display: flex; flex-direction: column; }
  .card header { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 6px; }
  .card header b { flex: 1; }
  .card .info { color: var(--muted); font-size: 12px; }
  .card .out { white-space: pre-wrap; word-break: break-word; flex: 1; }
  .card .out.err { color: var(--err); font-size: 14px; }
  .card .out.wait { color: var(--muted); }
  .card button { padding: 2px 8px; font-size: 12px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>多引擎翻译</h1>

  <div class="bar">
    <select id="from" aria-label="源语言"></select>
    <button id="swap" title="交换语言" aria-label="交换语言">⇄</button>
    <select id="to" aria-label="目标语言"></select>
    <span style="flex:1"></span>
    <button id="go" class="primary">翻译</button>
  </div>
  <textarea id="src" placeholder="输入要翻译的文字…（Ctrl/⌘ + Enter 翻译）"></textarea>
  <div class="meta"><span id="count">0 / 5000</span><span id="status"></span></div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

  <p class="note" id="note"></p>
</main>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mt-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('mt-' + k, JSON.stringify(v)); } catch {} },
  };

  let engines = [], langs = {};
  try {
    const r = await fetch('/api/engines');
    ({ engines, langs } = await r.json());
  } catch (e) {
    $('status').textContent = '连不上本地服务，请先运行 npm start';
    return;
  }

  // 语言下拉
  $('from').add(new Option('自动检测', 'auto'));
  for (const [k, v] of Object.entries(langs)) {
    $('from').add(new Option(v, k));
    $('to').add(new Option(v, k));
  }
  $('from').value = store.get('from', 'auto');
  $('to').value = store.get('to', 'zh');

  // 引擎开关
  const ready = engines.filter(e => e.configured);
  let picked = new Set(store.get('picked', ready.map(e => e.id)).filter(id => ready.some(e => e.id === id)));
  if (!picked.size) picked = new Set(ready.map(e => e.id));
  function renderChips() {
    $('chips').innerHTML = '';
    for (const e of engines) {
      const b = document.createElement('button');
      b.className = 'chip ' + (!e.configured ? 'off' : picked.has(e.id) ? 'on' : '');
      b.textContent = e.name;
      if (!e.configured) { b.title = '未配置密钥，见 .env.example'; b.disabled = true; }
      b.onclick = () => {
        picked.has(e.id) ? picked.delete(e.id) : picked.add(e.id);
        store.set('picked', [...picked]);
        renderChips();
      };
      $('chips').append(b);
    }
  }
  renderChips();
  const missing = engines.filter(e => !e.configured).map(e => e.name);
  $('note').textContent = missing.length
    ? `虚线的引擎还没配置密钥：在 translator/.env 里填好后重启服务即可启用。`
    : '';

  $('src').value = store.get('draft', '');
  const updateCount = () => { $('count').textContent = `${$('src').value.length} / 5000`; };
  updateCount();
  $('src').addEventListener('input', () => { updateCount(); store.set('draft', $('src').value); });
  $('from').onchange = () => store.set('from', $('from').value);
  $('to').onchange = () => store.set('to', $('to').value);
  $('swap').onclick = () => {
    if ($('from').value === 'auto') return;
    [$('from').value, $('to').value] = [$('to').value, $('from').value];
    store.set('from', $('from').value); store.set('to', $('to').value);
  };

  let runId = 0;
  async function run() {
    const text = $('src').value;
    if (!text.trim()) return;
    const list = engines.filter(e => picked.has(e.id));
    if (!list.length) { $('status').textContent = '至少选一个引擎'; return; }
    const id = ++runId;
    const from = $('from').value, to = $('to').value;
    $('grid').innerHTML = '';
    $('go').disabled = true;
    let done = 0;
    $('status').textContent = `0 / ${list.length}`;

    await Promise.all(list.map(async e => {
      const card = document.createElement('section');
      card.className = 'card';
      card.innerHTML = '<header><b></b><span class="info"></span><button hidden>复制</button></header><div class="out wait">翻译中…</div>';
      card.querySelector('b').textContent = e.name;
      $('grid').append(card);
      const out = card.querySelector('.out'), info = card.querySelector('.info'), copy = card.querySelector('button');
      try {
        const r = await fetch('/api/translate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ engine: e.id, text, from, to }),
        });
        const j = await r.json();
        if (id !== runId) return;
        info.textContent = (j.detected && from === 'auto' ? `识别为 ${langs[j.detected] || j.detected} · ` : '') + (j.ms != null ? `${(j.ms / 1000).toFixed(1)}s` : '');
        if (!r.ok) throw new Error(j.error || r.statusText);
        out.className = 'out';
        out.textContent = j.text;
        copy.hidden = false;
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(j.text); copy.textContent = '已复制'; }
          catch { copy.textContent = '复制失败'; }
          setTimeout(() => (copy.textContent = '复制'), 1200);
        };
      } catch (err) {
        if (id !== runId) return;
        out.className = 'out err';
        out.textContent = err.message;
      } finally {
        if (id === runId) $('status').textContent = `${++done} / ${list.length}`;
      }
    }));
    if (id === runId) $('go').disabled = false;
  }
  $('go').onclick = run;
  $('src').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
})();
</script>
</body>
</html>
